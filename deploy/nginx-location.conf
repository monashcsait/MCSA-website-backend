# Insert inside the EXISTING HTTPS server block for your backend domain.
# Configure the domain and its TLS certificate separately.
client_max_body_size 13m;

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_cache off;
}

# Do not add a second Access-Control-Allow-Origin header here.
# Flask owns the origin allowlist and the API's no-store response header.
